server:
  port: 4040
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: chatsphere

spring:
  application:
    name: chatsphere-backend

  profiles:
    active: dev

  data:
    mongodb:
      uri: mongodb://localhost:27017/chatsphere

  security:
    user:
      name: disabled
      password: disabled

logging:
  level:
    root: INFO
    com.chatsphere: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

frontend:
  url: http://localhost:5173

jwt:
  expiration-ms: 86400000 # 24 hours

bucket4j:
  enabled: true
  filters:
    - cache-name: "buckets"
      filter-method: "servlet"
      filter-type: "rate-limit"
      url: ".*"
      strategy: "local"
      rate-limits:
        - expression: "getRemoteAddr()"
          bandwidths:
            - capacity: 100
              time: 1
              unit: "minutes"
    - cache-name: "auth-buckets"
      filter-method: "servlet"
      filter-type: "rate-limit"
      url: "/api/auth/.*"
      strategy: "local"
      rate-limits:
        - expression: "getRemoteAddr()"
          bandwidths:
            - capacity: 10
              time: 1
              unit: "minutes"
    - cache-name: "chat-buckets"
      filter-method: "servlet"
      filter-type: "rate-limit"
      url: "/api/messages/.*"
      strategy: "local"
      rate-limits:
        - expression: "getRemoteAddr()"
          bandwidths:
            - capacity: 20
              time: 1
              unit: "minutes"
