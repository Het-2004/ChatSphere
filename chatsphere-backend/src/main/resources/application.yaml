server:
  port: 4040
  ssl:
    enabled: false
    # key-store: classpath:keystore.p12
    # key-store-password: changeit
    # key-store-type: PKCS12
    # key-alias: chatsphere

spring:
  application:
    name: chatsphere-backend

  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    mongodb:
      uri: mongodb://localhost:27017/chatsphere
      auto-index-creation: true
      uuid-representation: standard

  security:
    user:
      name: disabled
      password: disabled

  mail:
    host: localhost
    port: 2525
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO
    com.chatsphere: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

frontend:
  url: http://localhost:5173

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 hours

bucket4j:
  enabled: true
  filters:
    - cache-name: "buckets"
      filter-method: "servlet"
      filter-type: "rate-limit"
      url: ".*"
      strategy: "local"
      rate-limits:
        - expression: "getRemoteAddr()"
          bandwidths:
            - capacity: 100
              time: 1
              unit: "minutes"
    - cache-name: "auth-buckets"
      filter-method: "servlet"
      filter-type: "rate-limit"
      url: "/api/auth/.*"
      strategy: "local"
      rate-limits:
        - expression: "getRemoteAddr()"
          bandwidths:
            - capacity: 10
              time: 1
              unit: "minutes"
    - cache-name: "chat-buckets"
      filter-method: "servlet"
      filter-type: "rate-limit"
      url: "/api/messages/.*"
      strategy: "local"
      rate-limits:
        - expression: "getRemoteAddr()"
          bandwidths:
            - capacity: 20
              time: 1
              unit: "minutes"
