server:
  port: ${BACKEND_PORT:4040}
  ssl:
    enabled: false
    # key-store: classpath:keystore.p12
    # key-store-password: changeit
    # key-store-type: PKCS12
    # key-alias: chatsphere

spring:
  application:
    name: chatsphere-backend

  profiles:
    active: dev


  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/chatsphere}
      auto-index-creation: true
      uuid-representation: standard

  security:
    user:
      name: disabled
      password: disabled

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@chatsphere.com}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    root: INFO
    com.chatsphere: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

frontend:
  url: ${FRONTEND_URL:http://localhost:5173,http://localhost:5174}

admin:
  name: ${ADMIN_NAME:}
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 hours

bucket4j:
  enabled: true
  filters:
    - cache-name: "buckets"
      filter-method: "servlet"
      filter-type: "rate-limit"
      url: ".*"
      strategy: "local"
      rate-limits:
        - expression: "getRemoteAddr()"
          bandwidths:
            - capacity: 100
              time: 1
              unit: "minutes"
    - cache-name: "auth-buckets"
      filter-method: "servlet"
      filter-type: "rate-limit"
      url: "/api/auth/.*"
      strategy: "local"
      rate-limits:
        - expression: "getRemoteAddr()"
          bandwidths:
            - capacity: 10
              time: 1
              unit: "minutes"
    - cache-name: "chat-buckets"
      filter-method: "servlet"
      filter-type: "rate-limit"
      url: "/api/messages/.*"
      strategy: "local"
      rate-limits:
        - expression: "getRemoteAddr()"
          bandwidths:
            - capacity: 20
              time: 1
              unit: "minutes"

recaptcha:
  enabled: false
  secret-key: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
