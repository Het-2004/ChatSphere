# =========================
# SERVER CONFIG
# =========================
server.port=8091

# =========================
# SSL / HTTPS CONFIG
# =========================
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=chatsphere

# =========================
# DATABASE
# =========================
# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/chatsphere

# Redis
spring.redis.host=localhost
spring.redis.port=6379

# =========================
# JWT
#
# How to generate a secure secret:
#
# 1. Open a terminal or command prompt.
# 2. Run the following command:
#
#    For Linux/macOS:
#    openssl rand -base64 64
#
#    For Windows (using PowerShell):
#    [Convert]::ToBase64String((1..64 | % { [byte](Get-Random -Maximum 256) }))
#
# 3. Copy the generated string and paste it as the value for 'secret-key'.
#
# =========================
application.jwt.secret-key=THIS_IS_A_DEMO_SECRET_CHANGE_IT
application.jwt.expiration-ms=3600000
