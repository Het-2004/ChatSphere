server:
  port: 4040
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: chatsphere

spring:
  application:
    name: chatsphere-backend

  data:
    mongodb:
      uri: mongodb+srv://USER:PASSWORD@cluster.mongodb.net/chatsphere

logging:
  level:
    root: INFO
    com.chatsphere: INFO

frontend:
  url: http://localhost:5173/

jwt:
  expiration-ms: 86400000
