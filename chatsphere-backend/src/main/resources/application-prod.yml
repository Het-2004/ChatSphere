server:
  port: 443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: chatsphere

spring:
  application:
    name: chatsphere-backend

  data:
    mongodb:
      uri: mongodb://PROD_DB_HOST:27017/chatsphere

logging:
  level:
    root: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
